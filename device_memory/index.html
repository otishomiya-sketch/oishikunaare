<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>device memory</title>
</head>
<body>
<script>
  // Remembers the store's demo code in this browser, so reopening the shared
  // LINE link continues where the store left off, and makes the photo picker
  // ask for images. Renders nothing.
  const KEY = "menu-photo-pro-demo-code";

  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
  }

  window.addEventListener("message", (event) => {
    if (!event.data || event.data.type !== "streamlit:render") return;
    const save = event.data.args.save;
    try { if (save) localStorage.setItem(KEY, save); } catch (e) {}
    let value = "";
    try { value = localStorage.getItem(KEY) || ""; } catch (e) {}
    send("streamlit:setComponentValue", { value: value, dataType: "json" });
  });

  // Ask for photos by type so Android opens its photo gallery instead of a
  // file browser. Streamlit re-renders the uploader, so keep re-applying it.
  // (This frame is same-origin with the app, so it can reach its page.)
  function acceptImages() {
    try {
      window.parent.document.querySelectorAll('input[type="file"]').forEach((input) => {
        if (input.getAttribute("accept") !== "image/*") input.setAttribute("accept", "image/*");
      });
    } catch (e) {}
  }
  try {
    new MutationObserver(acceptImages).observe(window.parent.document.body, {
      subtree: true, childList: true, attributes: true, attributeFilter: ["accept"],
    });
  } catch (e) {}
  acceptImages();

  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: 0 });
</script>
</body>
</html>
