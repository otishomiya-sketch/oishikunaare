<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Before / After</title>
<style>
  html, body { margin: 0; background: transparent; }
  .c { position: relative; width: 100%; max-width: 720px; margin: 0 auto; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; --pos: 50%; touch-action: pan-y; background: #F3E7CF; }
  .c img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; }
  .c .b { clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
  .line { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 3px; margin-left: -1.5px; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .15); pointer-events: none; }
  .knob { position: absolute; top: 50%; left: var(--pos); width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: #fff; box-shadow: 0 2px 10px rgba(0, 0, 0, .25); display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .tag { position: absolute; top: 10px; padding: 3px 9px; border-radius: 6px; font: 900 12px/1.6 "Hiragino Sans", "Yu Gothic", sans-serif; letter-spacing: .12em; color: #fff; pointer-events: none; }
  .tb { left: 10px; background: rgba(20, 16, 13, .72); }
  .ta { right: 10px; background: #B7412A; }
  input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
  input:focus-visible ~ .knob { outline: 3px solid #E8B64C; outline-offset: 2px; }
</style>
</head>
<body>
<div class="c" id="c">
  <img id="after" alt="仕上がり">
  <img id="before" class="b" alt="元の写真">
  <div class="line"></div>
  <input id="range" type="range" min="0" max="100" value="50" aria-label="元の写真と仕上がりの境目">
  <div class="knob"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A211C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg></div>
  <span class="tag tb">BEFORE</span><span class="tag ta">AFTER</span>
</div>
<script>
  // Minimal Streamlit component protocol (no build step needed).
  const box = document.getElementById("c");
  const range = document.getElementById("range");

  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
  }
  function fit() {
    send("streamlit:setFrameHeight", { height: Math.ceil(box.getBoundingClientRect().height) });
  }

  range.addEventListener("input", () => box.style.setProperty("--pos", range.value + "%"));

  window.addEventListener("message", (event) => {
    if (!event.data || event.data.type !== "streamlit:render") return;
    const args = event.data.args;
    box.style.aspectRatio = args.width + " / " + args.height;
    document.getElementById("before").src = args.before;
    document.getElementById("after").src = args.after;
    fit();
  });

  new ResizeObserver(fit).observe(box);
  send("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
